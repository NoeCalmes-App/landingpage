name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-nowork, deploy-devis-app]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Jeton PUBLIC Mapbox (pk.). Sans lui, le build de production sort
          # sans carte : .env.local n'est pas commite, donc absent ici.
          # A creer dans Settings > Secrets and variables > Actions.
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: Checkout Nowork
        id: checkout-nowork
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: NoeCalmes-App/nowork
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: nowork-src

      - name: Checkout Nowork legacy fallback
        if: steps.checkout-nowork.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: NoeCalmes-App/devis-app
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: nowork-src

      - name: Build Nowork
        run: |
          cd nowork-src
          npm ci
          npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Inject Nowork into dist
        run: cp -r nowork-src/dist dist/nowork

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: "1800000"

      # IndexNow : previent Bing (et Yandex, Seznam...) des pages du site a
      # chaque mise en ligne, pour une indexation en heures plutot qu'en jours.
      # La cle est publique par design : le fichier public/02be746d7eb78efdbd07bde9284dfb03.txt prouve que le
      # site en est proprietaire. Ne bloque jamais le deploiement.
      - name: IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          sleep 60
          urls=$(curl -fsS https://noecalmes.fr/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)
          curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"noecalmes.fr\",\"key\":\"02be746d7eb78efdbd07bde9284dfb03\",\"keyLocation\":\"https://noecalmes.fr/02be746d7eb78efdbd07bde9284dfb03.txt\",\"urlList\":$urls}" \
            -w 'IndexNow : HTTP %{http_code}\n'
