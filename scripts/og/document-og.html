<!doctype html>
<!--
  SOURCE DE L'IMAGE DE PARTAGE DES DOCUMENTS À SIGNER
  public/assets/images/meta/document-og.png (1200 x 630)

  Pour la regenerer : voir scripts/og/README.md.
  Meme composition que espace-client-og.html. Page servie par Nowork sur
  /signature/ (voir .github/workflows/deploy.yml).
-->
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Jakarta'; font-weight: 800; src: url('../../public/assets/fonts/plus-jakarta/PlusJakartaSans-ExtraBold.ttf') format('truetype'); }
  @font-face { font-family: 'Jakarta'; font-weight: 700; src: url('../../public/assets/fonts/plus-jakarta/PlusJakartaSans-Bold.ttf') format('truetype'); }
  @font-face { font-family: 'Baskerville'; font-style: italic; font-weight: 400; src: url('LibreBaskerville-Italic.woff2') format('woff2'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    color: #033475;
    background:
      radial-gradient(ellipse 60% 70% at 86% 60%, rgba(102, 93, 255, 0.30) 0%, rgba(102, 93, 255, 0.10) 45%, rgba(102, 93, 255, 0) 72%),
      radial-gradient(ellipse 70% 50% at 20% 115%, rgba(102, 93, 255, 0.16) 0%, rgba(102, 93, 255, 0) 70%),
      linear-gradient(180deg, #fcfcfe 0%, #f6f5fc 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(102, 93, 255, 0.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(102, 93, 255, 0.07) 1px, transparent 1px);
    background-size: 100px 100px;
    background-position: 50px 15px;
    -webkit-mask-image: radial-gradient(ellipse 80% 90% at 40% 50%, #000 25%, transparent 100%);
            mask-image: radial-gradient(ellipse 80% 90% at 40% 50%, #000 25%, transparent 100%);
  }

  /* ─── Texte ─── */
  .copy {
    position: absolute; left: 96px; top: 0; bottom: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding-bottom: 48px;
  }
  .line1 {
    font-family: 'Baskerville', serif; font-style: italic; font-weight: 400;
    font-size: 46px; line-height: 1; color: #4b4b4b;
    margin-bottom: 20px; margin-left: 5px;
  }
  .line2 {
    font-family: 'Jakarta', sans-serif; font-weight: 800;
    font-size: 98px; line-height: 1.0; letter-spacing: -0.038em;
    color: #033475;
  }
  .line2 .accent {
    display: inline-block;
    background: linear-gradient(90deg, #6760ff, #7b73ef, #9e94ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding: 0 10px 28px 0; margin: 0 -10px -28px 0;
  }

  /* ─── Document et code abstraits ─── */
  .scene { position: absolute; right: 0; top: 0; width: 540px; height: 630px; }
  .page {
    position: absolute; right: 150px; top: 78px; width: 330px; height: 440px; padding: 34px 34px 0;
    background: #ffffff; border-radius: 16px;
    border: 1px solid rgba(3, 52, 117, 0.08);
    box-shadow: 0 30px 70px -30px rgba(102, 93, 255, 0.45), 0 2px 10px rgba(3, 52, 117, 0.05);
  }
  .page i { display: block; height: 10px; border-radius: 5px; background: #e6e4f3; margin-bottom: 12px; }
  .page i.t { width: 180px; height: 18px; border-radius: 9px; background: #c9c4ff; margin: 0 auto 28px; }
  .page i.a { width: 110px; height: 12px; background: #d2cfe6; margin-top: 24px; }
  .sign { position: absolute; left: 34px; right: 34px; bottom: 92px; height: 92px; border-radius: 12px; border: 2px dashed #cfcaff; background: #faf9ff; }
  .sign svg { position: absolute; inset: 10px 16px; width: calc(100% - 32px); height: calc(100% - 20px); }
  .code {
    position: absolute; right: 52px; top: 456px; width: 300px; padding: 20px 22px;
    background: #ffffff; border-radius: 22px;
    border: 1px solid rgba(3, 52, 117, 0.07);
    box-shadow: 0 40px 80px -30px rgba(3, 52, 117, 0.35), 0 2px 10px rgba(3, 52, 117, 0.05);
  }
  .code b { display: block; width: 120px; height: 10px; border-radius: 5px; background: #d2cfe6; margin-bottom: 14px; }
  .code div { display: flex; gap: 8px; }
  .code s { flex: 1; height: 44px; border-radius: 10px; background: #ece9ff; position: relative; text-decoration: none; }
  .code s::after { content: ''; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: #665dff; }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="scene">
    <div class="page">
      <i class="t"></i>
      <i style="width:100%"></i><i style="width:92%"></i><i style="width:70%"></i>
      <i class="a"></i><i style="width:100%"></i><i style="width:84%"></i><i style="width:60%"></i>
      <div class="sign"><svg viewBox="0 0 220 70" fill="none" stroke="#665dff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 48 C26 8 40 6 38 30 C36 58 20 62 30 44 C44 20 58 30 62 46 C68 60 78 30 88 34 C96 38 92 56 104 50 C120 40 124 18 136 26 C146 34 134 56 152 50 C172 42 182 30 210 34"/></svg></div>
    </div>
    <div class="code"><b></b><div><s></s><s></s><s></s><s></s><s></s><s></s></div></div>
  </div>

  <div class="copy">
    <div class="line1">À lire et à signer en ligne</div>
    <div class="line2">Document<br /><span class="accent">à signer</span></div>
  </div>
</body>
</html>
