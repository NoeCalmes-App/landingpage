<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!--
    APERCU DE PARTAGE DES LIENS SANS PAGE A EUX (decision de Noe du 10/10/2026).
    GitHub Pages sert ce fichier, en 404, pour toute adresse qui n'a pas de
    dossier dans dist : avant tout /espace-client/{client}/{jeton}, qui ne peut
    pas en avoir (un jeton par client). Le script plus bas rattrape le visiteur,
    mais WhatsApp et iMessage lisent le HTML SANS executer le script : ce sont
    ces balises qu'ils affichent. Elles sont donc celles de l'espace client,
    le lien de ce type le plus partage. Ce fichier etant le meme pour toutes les
    adresses inconnues, /maquette-visuel/... recoit le meme apercu.
    Image : scripts/og/README.md.
  -->
  <title>Espace client — Noé Calmes</title>
  <meta name="description" content="Devis, factures, suivi du projet et échanges avec Noé Calmes, au même endroit." />
  <meta name="robots" content="noindex, nofollow" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Noé Calmes" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:title" content="Espace client — Noé Calmes" />
  <meta property="og:description" content="Devis, factures, suivi du projet et échanges avec Noé Calmes, au même endroit." />
  <meta property="og:image" content="https://noecalmes.fr/assets/images/meta/espace-client-og.png" />
  <meta property="og:image:alt" content="Espace client : devis, factures et échanges avec Noé Calmes" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Espace client — Noé Calmes" />
  <meta name="twitter:description" content="Devis, factures, suivi du projet et échanges avec Noé Calmes, au même endroit." />
  <meta name="twitter:image" content="https://noecalmes.fr/assets/images/meta/espace-client-og.png" />
  <script>
    var path = window.location.pathname;
    var NOWORK_BASE = '/nowork';
    var LEGACY_BASE = '/app-devis';
    var cgvPdfMatch = path.match(/^\/cgv\/([^/]+\.pdf)$/i);
    var rootCgvPdfMatch = path.match(/^\/(CGV-[^/]+\.pdf)$/i);

    function redirectToLanding(cleanPath) {
      sessionStorage.setItem('redirect', cleanPath);
      window.location.replace('/');
    }

    function redirectToNowork(appPath) {
      sessionStorage.setItem('redirect', appPath);
      window.location.replace(NOWORK_BASE + '/');
    }

    // Anciens liens CGV : les devis/CDC deja generes pointent parfois vers
    // /CGV-{date}.pdf et parfois vers /cgv/{fichier}.
    // On garde ces URLs compatibles avec le dossier public actuel.
    if (path === '/cgv.pdf') {
      window.location.replace('/cgv/CGV-22-05-2026.pdf');
    } else if (rootCgvPdfMatch) {
      window.location.replace('/cgv/' + rootCgvPdfMatch[1]);
    } else if (cgvPdfMatch) {
      window.location.replace('/assets/documents/cgv/' + cgvPdfMatch[1]);
    } else if (path === LEGACY_BASE || path.startsWith(LEGACY_BASE + '/')) {
      var legacyRest = path.slice(LEGACY_BASE.length) || '/';
      if (legacyRest.startsWith('/espace-client/')) {
        redirectToLanding(legacyRest);
      } else if (legacyRest.startsWith('/maquette-visuel/')) {
        redirectToLanding(legacyRest);
      } else {
        redirectToNowork(NOWORK_BASE + legacyRest);
      }
    } else if (path === NOWORK_BASE || path.startsWith(NOWORK_BASE + '/')) {
      redirectToNowork(path);
    } else if (path.startsWith('/maquette-visuel/') || path.startsWith('/espace-client/')) {
      redirectToLanding(path);
    } else {
      redirectToLanding(path);
    }
  </script>
</head>
<body></body>
</html>
