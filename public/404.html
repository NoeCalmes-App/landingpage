<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    var path = window.location.pathname;
    // Routes SPA de l'app devis — redirect vers app-devis/index.html
    if (path.startsWith('/app-devis/') || path.startsWith('/maquette-visuel/') || path.startsWith('/espace-client/')) {
      // Réécrire /maquette-visuel/x/y → /app-devis/maquette-visuel/x/y
      // Réécrire /espace-client/token → /app-devis/espace-client/token
      var appPath = (path.startsWith('/maquette-visuel/') || path.startsWith('/espace-client/'))
        ? '/app-devis' + path
        : path;
      sessionStorage.setItem('redirect', appPath);
      window.location.replace('/app-devis/');
    } else {
      sessionStorage.setItem('redirect', path);
      window.location.replace('/');
    }
  </script>
</head>
<body></body>
</html>
