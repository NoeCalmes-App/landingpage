<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview Audit App</title>
    <style>
      @font-face {
        font-family: "Plus Jakarta Sans";
        src: url("../src/assets/font/PlusJakartaSans-Bold.ttf") format("truetype");
        font-weight: 700;
      }

      @font-face {
        font-family: "Plus Jakarta Sans";
        src: url("../src/assets/font/PlusJakartaSans-ExtraBold.ttf") format("truetype");
        font-weight: 800;
      }

      :root {
        --ink: #033475;
        --muted: #626b80;
        --brand: #665dff;
        --paper: #fffefc;
        --line: rgba(102, 93, 255, 0.09);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--ink);
      }

      .canvas {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 72px;
        display: grid;
        place-items: center;
        text-align: center;
        background:
          linear-gradient(180deg, #fffefc 0%, #f8f9ff 100%);
      }

      .canvas::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.58;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 42px 42px;
      }

      .content {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 970px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 34px;
        padding: 13px 22px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(228, 230, 242, 0.98);
        box-shadow: 0 18px 44px rgba(7, 17, 41, 0.08);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0;
      }

      .status-dot {
        position: relative;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #20b779;
        box-shadow: 0 0 0 7px rgba(32, 183, 121, 0.14);
        margin-right: 2px;
        flex: 0 0 auto;
      }

      .status-dot::after {
        content: "";
        position: absolute;
        inset: -7px;
        border-radius: inherit;
        background: rgba(32, 183, 121, 0.16);
        animation: pulse 1.6s ease-out infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(0.7);
          opacity: 0.9;
        }
        100% {
          transform: scale(1.65);
          opacity: 0;
        }
      }

      h1 {
        margin: 0;
        color: var(--ink);
        font-family: "Plus Jakarta Sans", Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 64px;
        line-height: 1.05;
        letter-spacing: 0;
        font-weight: 800;
      }

      .q {
        color: var(--ink);
      }

      .q-title {
        color: inherit;
      }

      .subtitle {
        margin: 42px 0 0;
        color: var(--muted);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 30px;
        line-height: 1.18;
        letter-spacing: 0;
        font-weight: 500;
      }

      .accent {
        display: inline-block;
        color: inherit;
        white-space: nowrap;
        font-weight: inherit;
      }

      .price {
        position: relative;
        display: inline-block;
        color: var(--brand);
        padding: 0 6px 4px;
        background: linear-gradient(
          to top,
          rgba(102, 93, 255, 0.18) 0 31%,
          transparent 31% 100%
        );
      }

      .title-line {
        display: block;
      }

      .idea-serif {
        display: block;
        margin-top: 16px;
        color: var(--muted);
        font-family: "Libre Baskerville", Georgia, "Times New Roman", serif;
        font-size: 0.92em;
        font-style: italic;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.02;
      }
    </style>
  </head>
      <body>
    <main class="canvas">
      <section class="content">
        <div class="badge"><span class="status-dot"></span>Audit gratuit · 2 minutes</div>
        <h1>
          <span class="title-line">Curieux de savoir combien</span>
          <span class="title-line"><span class="price">coûterait réellement</span> votre</span>
          <span class="idea-serif">idée d’application<span class="q-title">&nbsp;?</span></span>
        </h1>
        <p class="subtitle">
          Les 3 réponses avant d'investir 1&nbsp;€
        </p>
      </section>
    </main>
  </body>
</html>
